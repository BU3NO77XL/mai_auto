name: Build e assinar APK (release)

# PARTE 1 do robô: builda + assina + publica Release no GitHub.
# O envio pro Cloudflare fica pro passo seguinte.
# Monorepo: o projeto Android mora em android/.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/build-release.yml'
    # Ignora os commits de tag (v*) que o próprio robô cria — sem isso,
    # publicar a release dispararia o workflow de novo em loop.
    tags-ignore:
      - 'v*'

permissions:
  contents: write # necessário para criar tag + Release via GITHUB_TOKEN

defaults:
  run:
    working-directory: android

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        # v3 instalava por padrão o pacote 'tools', que o Google removeu do
        # repositório — quebrava com "Failed to find package 'tools'".
        # v4 + packages:'' instala só cmdline-tools; o resto vai via sdkmanager.
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar platform + build-tools do projeto
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sdkmanager --list_installed

      - name: Criar local.properties (SDK do runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restaurar keystore do secret
        run: |
          mkdir -p app/build
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/build/ci-upload-keystore.p12
          ls -la app/build/ci-upload-keystore.p12

      - name: Ler versionName/versionCode do Gradle
        id: version
        run: |
          chmod +x gradlew
          # Sem --offline: no CI a primeira execução precisa baixar o Gradle/AGP.
          # grep filtra só a linha da versão; tail pega o valor impresso pela task.
          NAME=$(./gradlew -q :app:printVersionName 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | tail -n 1)
          CODE=$(./gradlew -q :app:printVersionCode 2>/dev/null | grep -E '^[0-9]+$' | tail -n 1)
          echo "versionName=$NAME versionCode=$CODE"
          test -n "$NAME" || { echo "::error::versionName vazio"; exit 1; }
          test -n "$CODE" || { echo "::error::versionCode vazio"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Calcular versionCode por data (yyyyMMddNN)
        id: buildnum
        run: |
          # Data UTC + sequência do run no dia (2 dígitos): 2026101101.
          # Sempre crescente, legível nas páginas de download, até 99 builds/dia.
          DAY=$(date -u +%Y%m%d)
          SEQ=$((${{ github.run_number }} % 100))
          SEQ=$(printf '%02d' $SEQ)
          echo "number=${DAY}${SEQ}" >> "$GITHUB_OUTPUT"
          echo "MAI_BUILD_NUMBER=${DAY}${SEQ}" >> "$GITHUB_ENV"
          echo "versionCode=${DAY}${SEQ}"

      - name: Build APK release assinado
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Conferir assinatura
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | head -n 10

      - name: Guardar APK como artifact (backup 7 dias)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Publicar Release com tag de versão
        uses: softprops/action-gh-release@v2
        with:
          # Tag = v + versionName do Gradle (ex: v0.2.0). Se a tag já existir,
          # a action só anexa/atualiza os arquivos em vez de falhar.
          tag_name: v${{ steps.version.outputs.name }}
          name: Mai v${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          body: |
            APK release assinado gerado automaticamente pelo CI.

            - **versionName:** ${{ steps.version.outputs.name }}
            - **versionCode:** ${{ steps.version.outputs.code }}
            - **Data:** ${{ steps.buildnum.outputs.number }}
            - **Commit:** ${{ github.sha }}
          files: android/app/build/outputs/apk/release/*.apk
          make_latest: true

      - name: Enviar APK e version.json pro Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ steps.version.outputs.name }}
          BUILD: ${{ steps.version.outputs.code }}
          BUILD_DATE: ${{ steps.buildnum.outputs.number }}
          PUBLIC_URL: https://pub-5311c34a59bf43819f0ed00a3e278737.r2.dev
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          # date = dd/mm/aaaa derivado do versionCode yyyyMMddNN, para exibir
          # nas páginas de download ("Atualizado em 11/10/2026").
          DATE_FMT=$(echo "$BUILD_DATE" | sed -E 's/^([0-9]{4})([0-9]{2})([0-9]{2})[0-9]{2}$/\3\/\2\/\1/')

          jq -n \
            --arg version "$VERSION" \
            --argjson build "$BUILD" \
            --arg date "$DATE_FMT" \
            --arg url "$PUBLIC_URL/app-$VERSION.apk" \
            --arg sha256 "$SHA" \
            '{version:$version, build:$build, date:$date, url:$url, sha256:$sha256}' > version.json

          cat version.json

          aws s3 cp "$APK" "s3://$BUCKET/app-$VERSION.apk" --endpoint-url "$ENDPOINT" --content-type application/vnd.android.package-archive
          aws s3 cp "$APK" "s3://$BUCKET/app-latest.apk" --endpoint-url "$ENDPOINT" --content-type application/vnd.android.package-archive
          aws s3 cp version.json "s3://$BUCKET/version.json" --endpoint-url "$ENDPOINT" --content-type application/json --cache-control "no-cache"
